spring:
  application:
    name: onyak
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:onyak}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: true
jwt:
  # openssl rand -base64 64 사용
  secret: ${JWT_SECRET}
  access-token-validity-in-milliseconds: 3600000
  refresh-token-validity-in-milliseconds: 1209600000
